services:
  mysql:
    image: mysql:8.0
    container_name: remind_schedule_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: remind_schedule
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - '13307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
